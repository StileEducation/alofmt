line_width = 80
indent_width = 4
fit_indent_width = 2
quote_style = "single"
trailing_commas = true
prefer_percent_arrays = true
normalize_number_separators = true
explicit_standard_error = true
ignore_directives = ["alofmt-ignore", "stree-ignore"]
chain_break_threshold = 3
compact_chain_break_threshold = 2
compact_chain_blocks = ["sig"]
unaligned_command_calls = ["to", "not_to", "to_not"]
max_command_alignment = 40
